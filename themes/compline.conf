# vim:ft=kitty

## name: Compline
## author: Joshua Blais
## license: GPL-3.0
## blurb: A muted, low-saturation dark theme for kitty.

#: basic colors
foreground                      #f0efeb
background                      #1a1d21
selection_foreground            #f0efeb
selection_background            #3d424a

#: cursor
cursor                          #f0efeb
cursor_text_color               #1a1d21

#: url
url_color                       #b4c4bc

#: borders/bell
active_border_color             #b4c4bc
inactive_border_color           #3d424a
bell_border_color               #cdacac
visual_bell_color               none

#: tab bar
active_tab_foreground           #f0efeb
active_tab_background           #282c34
inactive_tab_foreground         #676d77
inactive_tab_background         #22262b
tab_bar_background              #1a1d21
tab_bar_margin_color            none

#: marks
mark1_foreground #1a1d21
mark1_background #b4c4bc
mark2_foreground #1a1d21
mark2_background #d4ccb4
mark3_foreground #1a1d21
mark3_background #cdacac

